<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050407" />
  <meta name="description" content="NOTERA — ваш личный чат с самим собой. Заметки, фото, файлы." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>NOTERA</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <!-- Auth Screen -->
  <div id="auth-screen" class="auth-screen hidden">
    <div class="auth-container">
      <div class="auth-logo">
        <img src="assets/logo.svg" alt="NOTERA" width="48" height="48" />
        <h1>NOTERA</h1>
        <p class="auth-tagline">Ваш личный чат с самим собой</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Вход</button>
        <button class="auth-tab" data-tab="register">Регистрация</button>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="login-password">Пароль</label>
          <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Войти</button>
        <button type="button" id="forgot-password-btn" class="btn-link">Забыли пароль?</button>
      </form>

      <!-- Register Form -->
      <form id="register-form" class="auth-form hidden">
        <div class="form-group">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="register-password">Пароль</label>
          <input type="password" id="register-password" placeholder="Минимум 6 символов" required minlength="6" autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label for="register-password-confirm">Подтвердите пароль</label>
          <input type="password" id="register-password-confirm" placeholder="••••••••" required minlength="6" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Создать аккаунт</button>
      </form>

      <!-- Forgot Password Form -->
      <form id="forgot-form" class="auth-form hidden">
        <p class="auth-hint">Введите email, и мы отправим ссылку для сброса пароля.</p>
        <div class="form-group">
          <label for="forgot-email">Email</label>
          <input type="email" id="forgot-email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Отправить ссылку</button>
        <button type="button" id="back-to-login-btn" class="btn-link">Назад ко входу</button>
      </form>

      <div class="auth-divider">
        <span>или</span>
      </div>

      <button id="github-login-btn" class="btn btn-github btn-block">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        Войти через GitHub
      </button>

      <div id="auth-message" class="auth-message hidden"></div>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="app hidden">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <img src="assets/logo.svg" alt="NOTERA" class="header-logo" width="28" height="28" />
        <div class="header-title">
          <span class="chat-name">Личный чат</span>
          <span class="chat-status" id="connection-status">онлайн</span>
        </div>
      </div>
      <div class="header-right">
        <button id="search-btn" class="icon-btn" title="Поиск" aria-label="Поиск">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </button>
        <button id="settings-btn" class="icon-btn" title="Настройки" aria-label="Настройки">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <div class="user-avatar" id="user-avatar" title="Профиль">
          <span id="avatar-initial">U</span>
        </div>
      </div>
    </header>

    <!-- Pinned messages bar -->
    <div id="pinned-bar" class="pinned-bar hidden">
      <div class="pinned-content" id="pinned-content">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="pin-icon">
          <path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/>
        </svg>
        <span id="pinned-text" class="pinned-text"></span>
      </div>
      <button id="unpin-btn" class="icon-btn small" title="Открепить" aria-label="Открепить">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Search bar -->
    <div id="search-bar" class="search-bar hidden">
      <div class="search-input-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="search-input" placeholder="Поиск по сообщениям и файлам..." autocomplete="off" />
        <button id="search-clear-btn" class="icon-btn small hidden" title="Очистить">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <button id="search-close-btn" class="btn-text">Отмена</button>
    </div>

    <!-- Messages area -->
    <main id="messages-area" class="messages-area">
      <div id="messages-list" class="messages-list">
        <!-- Messages will be rendered here -->
      </div>
      <div id="empty-state" class="empty-state">
        <div class="empty-icon">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <p>Это ваше личное пространство.<br>Отправьте первое сообщение, фотографию или файл.</p>
      </div>
      <div id="load-more" class="load-more hidden">
        <button id="load-more-btn" class="btn-text">Загрузить более ранние</button>
      </div>
    </main>

    <!-- Composer -->
    <footer class="composer">
      <div id="attachments-preview" class="attachments-preview hidden"></div>
      <div class="composer-row">
        <button id="attach-btn" class="icon-btn" title="Прикрепить файл" aria-label="Прикрепить">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <input type="file" id="file-input" multiple accept="image/*,video/*,.pdf,.txt,.doc,.docx,.zip,.rar,.7z,.md,.json,.csv" hidden />
        <div class="input-wrap">
          <textarea id="message-input" placeholder="Сообщение..." rows="1" maxlength="10000"></textarea>
        </div>
        <button id="send-btn" class="icon-btn send-btn" title="Отправить" aria-label="Отправить" disabled>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- Context Menu -->
  <div id="context-menu" class="context-menu hidden">
    <button data-action="copy">Копировать</button>
    <button data-action="edit">Редактировать</button>
    <button data-action="pin">Закрепить</button>
    <button data-action="delete" class="danger">Удалить</button>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>Настройки</h2>
        <button id="settings-close" class="icon-btn" aria-label="Закрыть">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="settings-section">
          <h3>Аккаунт</h3>
          <div class="settings-item">
            <span>Email</span>
            <span id="settings-email" class="settings-value">—</span>
          </div>
          <div class="settings-item">
            <span>Имя пользователя</span>
            <span id="settings-username" class="settings-value">—</span>
          </div>
        </div>
        <div class="settings-section">
          <h3>Действия</h3>
          <button id="logout-btn" class="btn btn-danger btn-block">Выйти из аккаунта</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Image Viewer -->
  <div id="image-viewer" class="image-viewer hidden">
    <button id="viewer-close" class="viewer-close" aria-label="Закрыть">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <img id="viewer-image" src="" alt="Просмотр" />
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/messages.js"></script>
  <script src="js/attachments.js"></script>
  <script src="js/search.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
